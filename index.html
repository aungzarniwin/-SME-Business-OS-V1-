<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SME Business OS V2 Commercial</title>

<style>
:root{
  --sidebar:#0f172a;
  --sidebar2:#111c31;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
  --shadow:0 8px 30px rgba(15,23,42,.08);
  --radius:16px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#fff;
  position:fixed;
  inset:0 auto 0 0;
  z-index:50;
  overflow-y:auto;
  padding:18px 14px;
}

.brand{
  padding:8px 10px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:14px;
}

.brand-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand-sub{
  font-size:11px;
  color:#94a3b8;
  margin-top:4px;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:14px;
  background:rgba(255,255,255,.06);
  border-radius:12px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#2563eb;
  color:#fff;
  font-weight:800;
}

.profile-mini strong{
  display:block;
  font-size:13px;
}

.profile-mini span{
  display:block;
  font-size:11px;
  color:#94a3b8;
  margin-top:2px;
}

.nav-section{
  margin:18px 8px 7px;
  color:#64748b;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:10px;
  margin:3px 0;
  text-align:left;
  font-size:13px;
}

.nav-btn:hover{
  background:rgba(255,255,255,.07);
  color:#fff;
}

.nav-btn.active{
  background:#2563eb;
  color:#fff;
  box-shadow:0 5px 18px rgba(37,99,235,.25);
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.premium-box{
  margin:20px 4px 8px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#172554,#1e40af);
  border:1px solid rgba(255,255,255,.1);
}

.premium-box strong{
  display:block;
  font-size:13px;
}

.premium-box small{
  display:block;
  color:#bfdbfe;
  line-height:1.5;
  margin:5px 0 10px;
}

.main{
  width:100%;
  margin-left:270px;
  min-width:0;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#f1f5f9;
  width:40px;
  height:40px;
  border-radius:10px;
}

.page-title{
  font-size:20px;
  font-weight:800;
}

.page-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:9px 11px;
}

.content{
  padding:24px;
  max-width:1600px;
  margin:auto;
}

.welcome{
  margin-bottom:20px;
}

.welcome h1{
  margin:0;
  font-size:26px;
}

.welcome p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:17px;
  box-shadow:var(--shadow);
}

.stat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.stat-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#eff6ff;
  display:grid;
  place-items:center;
}

.stat-value{
  font-size:23px;
  font-weight:850;
  margin-top:12px;
  letter-spacing:-.4px;
}

.stat-note{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.grid-2{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.card-head{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.card-head h3{
  margin:0;
  font-size:15px;
}

.card-body{
  padding:18px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:750;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{background:var(--primary2)}

.btn-secondary{
  background:#eef2f7;
  color:#1f2937;
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

.btn-danger{
  background:#fee2e2;
  color:#991b1b;
}

.btn-warning{
  background:#fef3c7;
  color:#92400e;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.search{
  flex:1;
  min-width:180px;
}

input,select,textarea{
  width:100%;
  border:1px solid #dbe1ea;
  background:#fff;
  border-radius:10px;
  padding:10px 11px;
  outline:none;
  color:var(--text);
}

input:focus,select:focus,textarea:focus{
  border-color:#60a5fa;
  box-shadow:0 0 0 3px rgba(96,165,250,.12);
}

textarea{min-height:90px;resize:vertical}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:750;
  color:#475569;
  margin-bottom:5px;
}

.field.full{grid-column:1/-1}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:11px 10px;
  border-bottom:1px solid #eef0f4;
  text-align:left;
  font-size:12px;
  white-space:nowrap;
}

th{
  background:#f8fafc;
  color:#64748b;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

td.num,th.num{text-align:right}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.badge{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
}

.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f1f5f9;color:#475569}

.action-row{
  display:flex;
  gap:5px;
}

.action-row .btn{
  padding:6px 8px;
  font-size:10px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.quick-btn{
  border:1px solid var(--line);
  background:#fff;
  padding:14px 8px;
  border-radius:12px;
  text-align:center;
  font-weight:750;
  font-size:11px;
}

.quick-btn:hover{
  border-color:#93c5fd;
  background:#f8fbff;
}

.invoice-items{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:auto;
  margin-top:15px;
}

.invoice-items table{min-width:720px}

.total-box{
  margin-top:15px;
  margin-left:auto;
  width:min(360px,100%);
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
}

.total-line{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  font-size:12px;
}

.total-line.final{
  border-top:1px solid var(--line);
  margin-top:6px;
  padding-top:10px;
  font-size:16px;
  font-weight:850;
}

.alert{
  padding:11px 13px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:12px;
}

.alert-warning{background:#fff7ed;color:#9a3412}
.alert-info{background:#eff6ff;color:#1e40af}
.alert-danger{background:#fef2f2;color:#991b1b}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{display:flex}

.modal-box{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.2);
}

.modal-head{
  padding:17px 19px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
  font-size:16px;
}

.modal-close{
  border:0;
  background:#f1f5f9;
  width:34px;
  height:34px;
  border-radius:9px;
}

.modal-body{padding:19px}

.modal-foot{
  padding:14px 19px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  background:#111827;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:45;
}

.chart{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:15px 5px 5px;
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
}

.bar{
  width:100%;
  max-width:45px;
  border-radius:7px 7px 2px 2px;
  background:#2563eb;
  min-height:3px;
}

.bar-label{
  font-size:9px;
  color:#64748b;
}

.bar-value{
  font-size:9px;
  color:#334155;
}

.progress{
  height:8px;
  border-radius:999px;
  background:#e5e7eb;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:#2563eb;
}

.kpi-list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.kpi-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:5px;
}

.text-success{color:var(--success)}
.text-danger{color:var(--danger)}
.text-warning{color:var(--warning)}
.text-muted{color:var(--muted)}

@media(max-width:1050px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}

  .main{margin-left:0}

  .mobile-menu{display:block}

  .topbar{padding:0 14px}
  .content{padding:15px}

  .page-title{font-size:17px}

  .top-actions .hide-mobile{display:none}

  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:13px}
  .stat-value{font-size:18px}

  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .field.full{grid-column:auto}

  .quick-grid{grid-template-columns:repeat(2,1fr)}

  .welcome h1{font-size:21px}
}

@media(max-width:430px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat-label{font-size:10px}
  .stat-value{font-size:16px}
  .card-body{padding:13px}
}
</style>
</head>

<body>

<div class="app">

<script>
"use strict";

/* =========================================================
   SME BUSINESS OS V2 COMMERCIAL
   Local Business Engine
========================================================= */

const STORAGE_KEY = "SME_BUSINESS_OS_V2_COMMERCIAL";

let db = loadDB();
let currentPage = "dashboard";
let saleCart = [];
let purchaseCart = [];

/* =========================================================
   DATABASE
========================================================= */

function defaultDB(){
  return {
    version:2,
    settings:{
      businessName:"My SME Business",
      phone:"",
      address:"",
      currency:"MMK",
      invoiceFooter:"Thank you for your business"
    },
    products:[],
    sales:[],
    purchases:[],
    customers:[],
    suppliers:[],
    expenses:[],
    customerPayments:[],
    supplierPayments:[],
    stockMovements:[],
    cashTransactions:[],
    users:[
      {
        id:"USR001",
        name:"Business Owner",
        email:"",
        role:"Owner",
        active:true,
        createdAt:nowISO()
      }
    ]
  };
}

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultDB();

    const parsed=JSON.parse(raw);

    const base=defaultDB();

    return {
      ...base,
      ...parsed,
      settings:{...base.settings,...(parsed.settings||{})},
      products:parsed.products||[],
      sales:parsed.sales||[],
      purchases:parsed.purchases||[],
      customers:parsed.customers||[],
      suppliers:parsed.suppliers||[],
      expenses:parsed.expenses||[],
      customerPayments:parsed.customerPayments||[],
      supplierPayments:parsed.supplierPayments||[],
      stockMovements:parsed.stockMovements||[],
      cashTransactions:parsed.cashTransactions||[],
      users:parsed.users||base.users
    };

  }catch(e){
    console.error(e);
    return defaultDB();
  }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function nowISO(){
  return new Date().toISOString();
}

function pad(n){
  return String(n).padStart(2,"0");
}

function localDate(date=new Date()){
  return date.getFullYear()+"-"+pad(date.getMonth()+1)+"-"+pad(date.getDate());
}

function localTime(date=new Date()){
  return pad(date.getHours())+":"+pad(date.getMinutes());
}

function localMonth(date=new Date()){
  return date.getFullYear()+"-"+pad(date.getMonth()+1);
}

function uid(prefix){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}

function money(n){
  const value=Number(n)||0;
  return value.toLocaleString("en-US")+" "+(db.settings.currency||"MMK");
}

function num(v){
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   UI HELPERS
========================================================= */

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function openModal(title,body,foot=""){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalFoot").innerHTML=foot;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function setPageTitle(title){
  document.getElementById("pageTitle").textContent=title;
}

function formatDate(date){
  if(!date) return "-";
  return date;
}

function statusBadge(status){
  const s=String(status||"").toLowerCase();

  if(s==="paid"||s==="completed"||s==="active"){
    return `<span class="badge badge-success">${esc(status)}</span>`;
  }

  if(s==="partial"||s==="credit"||s==="pending"){
    return `<span class="badge badge-warning">${esc(status)}</span>`;
  }

  if(s==="voided"||s==="overdue"){
    return `<span class="badge badge-danger">${esc(status)}</span>`;
  }

  return `<span class="badge badge-gray">${esc(status||"Unknown")}</span>`;
}

/* =========================================================
   CALCULATIONS
========================================================= */

function getSaleTotal(sale){
  return num(sale.total);
}

function getPurchaseTotal(purchase){
  return num(purchase.total);
}

function totalSales(dateFrom="",dateTo=""){
  return db.sales
    .filter(s=>s.status!=="Voided")
    .filter(s=>dateFilter(s.date,dateFrom,dateTo))
    .reduce((a,s)=>a+num(s.total),0);
}

function totalCOGS(dateFrom="",dateTo=""){
  return db.sales
    .filter(s=>s.status!=="Voided")
    .filter(s=>dateFilter(s.date,dateFrom,dateTo))
    .reduce((sum,s)=>{
      return sum+s.items.reduce((x,i)=>x+(num(i.qty)*num(i.costAtSale)),0);
    },0);
}

function totalExpenses(dateFrom="",dateTo=""){
  return db.expenses
    .filter(e=>dateFilter(e.date,dateFrom,dateTo))
    .reduce((a,e)=>a+num(e.amount),0);
}

function grossProfit(dateFrom="",dateTo=""){
  return totalSales(dateFrom,dateTo)-totalCOGS(dateFrom,dateTo);
}

function netProfit(dateFrom="",dateTo=""){
  return grossProfit(dateFrom,dateTo)-totalExpenses(dateFrom,dateTo);
}

function receivables(){
  const saleBalance=db.sales
    .filter(s=>s.status!=="Voided")
    .reduce((a,s)=>a+num(s.balance),0);

  return saleBalance;
}

function payables(){
  return db.purchases
    .filter(p=>p.status!=="Voided")
    .reduce((a,p)=>a+num(p.balance),0);
}

function stockValue(){
  return db.products.reduce((a,p)=>{
    return a+(num(p.stock)*num(p.cost));
  },0);
}

function cashBalance(){
  return db.cashTransactions
    .reduce((a,t)=>a+num(t.amount),0);
}

function dateFilter(date,from,to){
  if(from && date<from) return false;
  if(to && date>to) return false;
  return true;
}

function productStock(productId){
  const p=db.products.find(x=>x.id===productId);
  return p?num(p.stock):0;
}

function saveProduct(id){

  const name=document.getElementById("fProductName").value.trim();

  if(!name){
    toast("Product name is required");
    return;
  }

  const cost=num(document.getElementById("fProductCost").value);
  const price=num(document.getElementById("fProductPrice").value);
  const minStock=num(document.getElementById("fProductMin").value);

  if(cost<0 || price<0){
    toast("Price cannot be negative");
    return;
  }

  if(id){

    const p=db.products.find(x=>x.id===id);

    p.name=name;
    p.sku=document.getElementById("fProductSKU").value.trim();
    p.category=document.getElementById("fProductCategory").value.trim();
    p.unit=document.getElementById("fProductUnit").value;
    p.cost=cost;
    p.price=price;
    p.minStock=minStock;
    p.updatedAt=nowISO();

  }else{

    const product={
      id:uid("PRD"),
      name,
      sku:document.getElementById("fProductSKU").value.trim(),
      category:document.getElementById("fProductCategory").value.trim(),
      unit:document.getElementById("fProductUnit").value,
      cost,
      price,
      stock:num(document.getElementById("fProductStock").value),
      minStock,
      createdAt:nowISO()
    };

    db.products.push(product);

    if(product.stock>0){
      db.stockMovements.push({
        id:uid("STM"),
        date:localDate(),
        time:localTime(),
        type:"Opening Stock",
        productId:product.id,
        productName:product.name,
        qty:product.stock,
        before:0,
        after:product.stock,
        reference:"Opening"
      });
    }
  }

  saveDB();
  closeModal();
  renderPage(currentPage);
  toast("Product saved");
}

function deleteProduct(id){

  const p=db.products.find(x=>x.id===id);

  if(!p) return;

  const used=db.sales.some(s=>s.items.some(i=>i.productId===id)) ||
             db.purchases.some(s=>s.items.some(i=>i.productId===id));

  if(used){
    toast("This product has transaction history and cannot be deleted");
    return;
  }

  if(!confirm("Delete this product?")) return;

  db.products=db.products.filter(x=>x.id!==id);

  saveDB();
  renderPage("products");
  toast("Product deleted");
}

function addSaleItem(){

  const productId=document.getElementById("saleProduct").value;
  const qty=num(document.getElementById("saleQty").value);

  if(!productId){
    toast("Select a product");
    return;
  }

  if(qty<=0){
    toast("Quantity must be greater than zero");
    return;
  }

  const product=db.products.find(p=>p.id===productId);

  if(!product) return;

  const existing=saleCart.find(x=>x.productId===productId);

  const newQty=(existing?existing.qty:0)+qty;

  if(newQty>num(product.stock)){
    toast(`Not enough stock for ${product.name}`);
    return;
  }

  if(existing){
    existing.qty=newQty;
  }else{
    saleCart.push({
      productId:product.id,
      name:product.name,
      qty,
      price:num(product.price),
      costAtSale:num(product.cost),
      discount:0
    });
  }

  document.getElementById("saleQty").value=1;
  updateSaleForm();
}

function updateSaleForm(){

  if(!body) return;

  body.innerHTML=saleCart.length

      return `

          <td class="num">${money(i.price)}</td>
          <td class="num">
            <input style="width:90px" type="number" min="0"
              value="${num(i.discount)}"
              onchange="changeSaleDiscount(${index},this.value)">
          </td>
          <td class="num">${money(Math.max(0,line))}</td>
          <td>
            <button class="btn btn-danger" onclick="removeSaleItem(${index})">×</button>
          </td>
        </tr>
      `;

    }).join("")
    :
    `<tr><td colspan="6"><div class="empty">Add products to the invoice</div></td></tr>`;

  const subtotal=saleCart.reduce((a,i)=>a+(num(i.qty)*num(i.price)),0);
  const discount=num(document.getElementById("saleDiscount")?.value);
  const lineDiscount=saleCart.reduce((a,i)=>a+num(i.discount),0);
  const total=Math.max(0,subtotal-lineDiscount-discount);

  const payment=document.getElementById("salePayment")?.value||"Cash";

  const paidInput=document.getElementById("salePaid");

  if(payment==="Credit"){
    if(paidInput && document.activeElement!==paidInput){
      paidInput.value=0;
    }
  }else{
    if(paidInput && document.activeElement!==paidInput && saleCart.length){
      paidInput.value=total;
    }
  }

  const paid=num(paidInput?.value);
  const balance=Math.max(0,total-paid);

  const summary=document.getElementById("saleSummary");

  if(summary){

    summary.innerHTML=`
      <div class="total-box">

        <div class="total-line">
          <span>Subtotal</span>
          <strong>${money(subtotal)}</strong>
        </div>

        <div class="total-line">
          <span>Item Discounts</span>
          <strong>${money(lineDiscount)}</strong>
        </div>

        <div class="total-line">
          <span>Invoice Discount</span>
          <strong>${money(discount)}</strong>
        </div>

        <div class="total-line final">
          <span>Total</span>
          <strong>${money(total)}</strong>
        </div>

        <div class="total-line">
          <span>Paid</span>
          <strong>${money(paid)}</strong>
        </div>

        <div class="total-line">
          <span>Balance</span>
          <strong class="${balance>0?'text-danger':'text-success'}">${money(balance)}</strong>
        </div>

      </div>
    `;
  }
}

function changeSaleDiscount(index,value){
  saleCart[index].discount=Math.max(0,num(value));
  updateSaleForm();
}

function removeSaleItem(index){
  saleCart.splice(index,1);
  updateSaleForm();
}

function completeSale(){

  if(!saleCart.length){
    toast("Add at least one product");
    return;
  }

  const customerId=document.getElementById("saleCustomer").value;
  const customer=db.customers.find(c=>c.id===customerId);

  const payment=document.getElementById("salePayment").value;

  const subtotal=saleCart.reduce((a,i)=>a+(num(i.qty)*num(i.price)),0);
  const itemDiscount=saleCart.reduce((a,i)=>a+num(i.discount),0);
  const invoiceDiscount=num(document.getElementById("saleDiscount").value);

  const total=Math.max(0,subtotal-itemDiscount-invoiceDiscount);

  let paid=num(document.getElementById("salePaid").value);

  if(payment!=="Credit"){
    paid=total;
  }

  if(paid<0) paid=0;
  if(paid>total) paid=total;

  const balance=total-paid;

  if(payment==="Credit" && !customerId && balance>0){
    toast("Select a customer for credit sale");
    return;
  }

  for(const item of saleCart){

    const p=db.products.find(x=>x.id===item.productId);

    if(!p || num(p.stock)<num(item.qty)){
      toast(`Insufficient stock for ${item.name}`);
      return;
    }
  }

  const sale={
    id:uid("SAL"),
    invoice:newInvoiceNumber(),
    date:localDate(),
    time:localTime(),
    customerId:customerId||"",
    customerName:customer?.name||"Walk-in",
    items:saleCart.map(i=>({...i})),
    subtotal,
    discount:itemDiscount+invoiceDiscount,
    total,
    payment,
    paid,
    balance,
    status:balance<=0?"Paid":"Credit",
    notes:"",
    createdAt:nowISO()
  };

  db.sales.push(sale);

  for(const item of saleCart){

    const p=db.products.find(x=>x.id===item.productId);

    const before=num(p.stock);

    p.stock=before-num(item.qty);

    db.stockMovements.push({
      id:uid("STM"),
      date:sale.date,
      time:sale.time,
      type:"Sale",
      productId:p.id,
      productName:p.name,
      qty:-num(item.qty),
      before,
      after:p.stock,
      reference:sale.invoice
    });
  }

  if(paid>0){

    db.cashTransactions.push({
      id:uid("CASH"),
      date:sale.date,
      time:sale.time,
      type:"Sale",
      category:"Sales",
      description:`${sale.invoice} - ${sale.customerName}`,
      amount:paid,
      reference:sale.invoice
    });
  }

  saveDB();
  closeModal();
  renderPage("sales");

  toast(`Sale ${sale.invoice} completed`);

  if(confirm("Sale completed. Print receipt now?")){
    printSale(sale.id);
  }
}

========================================================= */

function voidSale(id){

  const sale=db.sales.find(s=>s.id===id);

  if(!sale || sale.status==="Voided") return;

  if(!confirm(`Void invoice ${sale.invoice}? Stock and cash records will be reversed.`)){
    return;
  }

  sale.status="Voided";
  sale.voidedAt=nowISO();

  for(const item of sale.items){

    const p=db.products.find(x=>x.id===item.productId);

    if(p){

      const before=num(p.stock);

      p.stock=before+num(item.qty);

      db.stockMovements.push({
        id:uid("STM"),
        date:localDate(),
        time:localTime(),
        type:"Sale Void",
        productId:p.id,
        productName:p.name,
        qty:num(item.qty),
        before,
        after:p.stock,
        reference:sale.invoice
      });
    }
  }

  if(num(sale.paid)>0){

    db.cashTransactions.push({
      id:uid("CASH"),
      date:localDate(),
      time:localTime(),
      type:"Sale Void",
      category:"Reversal",
      description:`Void ${sale.invoice}`,
      amount:-num(sale.paid),
      reference:sale.invoice
    });
  }

  saveDB();
  renderPage("sales");
  toast("Sale voided and stock restored");
}

function addPurchaseItem(){

  const productId=document.getElementById("purchaseProduct").value;
  const qty=num(document.getElementById("purchaseQty").value);
  const cost=num(document.getElementById("purchaseCost").value);

  if(!productId){
    toast("Select a product");
    return;
  }

  if(qty<=0 || cost<0){
    toast("Enter valid quantity and cost");
    return;
  }

  const product=db.products.find(p=>p.id===productId);

  if(!product) return;

  const existing=purchaseCart.find(x=>x.productId===productId);

  if(existing){
    existing.qty+=qty;
    existing.cost=cost;
  }else{
    purchaseCart.push({
      productId,
      name:product.name,
      qty,
      cost
    });
  }

  document.getElementById("purchaseQty").value=1;
  document.getElementById("purchaseCost").value=product.cost||0;

  updatePurchaseForm();
}

function updatePurchaseForm(){

  const body=document.getElementById("purchaseCartBody");

  if(!body) return;

  body.innerHTML=purchaseCart.length
    ?
    purchaseCart.map((i,index)=>`
      <tr>
        <td>${esc(i.name)}</td>
        <td class="num">${num(i.qty)}</td>

        </td>
      </tr>
    `).join("")
    :
    `<tr><td colspan="5"><div class="empty">Add products to the purchase</div></td></tr>`;

  const total=purchaseCart.reduce((a,i)=>a+(num(i.qty)*num(i.cost)),0);
  const payment=document.getElementById("purchasePayment")?.value||"Cash";
  const paidInput=document.getElementById("purchasePaid");

  if(payment==="Credit"){
    if(paidInput && document.activeElement!==paidInput){
      paidInput.value=0;
    }
  }else{
    if(paidInput && document.activeElement!==paidInput && purchaseCart.length){
      paidInput.value=total;
    }
  }

  const paid=num(paidInput?.value);
  const balance=Math.max(0,total-paid);

  const summary=document.getElementById("purchaseSummary");

  if(summary){
    summary.innerHTML=`
      <div class="total-box">

        </div>
      </div>
    `;
  }
}

function removePurchaseItem(index){

}

function completePurchase(){

  if(!purchaseCart.length){
    toast("Add at least one product");
    return;
  }

  const supplierId=document.getElementById("purchaseSupplier").value;
  const supplier=db.suppliers.find(s=>s.id===supplierId);

  if(!supplierId){
    toast("Select a supplier");
    return;
  }

  const payment=document.getElementById("purchasePayment").value;

  const total=purchaseCart.reduce((a,i)=>a+(num(i.qty)*num(i.cost)),0);

  let paid=num(document.getElementById("purchasePaid").value);

  if(payment!=="Credit"){
    paid=total;
  }

  paid=Math.max(0,Math.min(total,paid));

  const balance=total-paid;

  const purchase={
    id:uid("PUR"),
    invoice:newPurchaseInvoice(),
    date:localDate(),
    time:localTime(),
    supplierId,
    supplierName:supplier.name,
    items:purchaseCart.map(i=>({...i})),
    total,
    paid,
    balance,
    payment,
    status:balance<=0?"Paid":"Credit",
    createdAt:nowISO()
  };

  db.purchases.push(purchase);

  for(const item of purchaseCart){

    const p=db.products.find(x=>x.id===item.productId);

    const before=num(p.stock);

    p.stock=before+num(item.qty);

    /*
      Weighted average cost
      New stock cost becomes average cost
    */

    const oldValue=before*num(p.cost);
    const newValue=num(item.qty)*num(item.cost);
    const totalQty=before+num(item.qty);

    if(totalQty>0){
      p.cost=(oldValue+newValue)/totalQty;
    }

    db.stockMovements.push({
      id:uid("STM"),
      date:purchase.date,
      time:purchase.time,
      type:"Purchase",
      productId:p.id,
      productName:p.name,
      qty:num(item.qty),
      before,
      after:p.stock,
      reference:purchase.invoice
    });
  }

  if(paid>0){

    db.cashTransactions.push({
      id:uid("CASH"),
      date:purchase.date,
      time:purchase.time,
      type:"Purchase",
      category:"Purchases",
      description:`${purchase.invoice} - ${purchase.supplierName}`,
      amount:-paid,
      reference:purchase.invoice
    });
  }

  saveDB();
  closeModal();
  renderPage("purchases");

  toast(`Purchase ${purchase.invoice} completed`);
}

function voidPurchase(id){

  const purchase=db.purchases.find(p=>p.id===id);

  if(!purchase || purchase.status==="Voided") return;

  if(!confirm(`Void purchase ${purchase.invoice}? Stock and cash records will be reversed.`)){
    return;
  }

  for(const item of purchase.items){

    const p=db.products.find(x=>x.id===item.productId);

    if(!p) continue;

    if(num(p.stock)<num(item.qty)){
      toast(`Cannot void because stock for ${item.name} is already insufficient`);
      return;
    }
  }

  purchase.status="Voided";
  purchase.voidedAt=nowISO();

  for(const item of purchase.items){

    const p=db.products.find(x=>x.id===item.productId);

    const before=num(p.stock);

    p.stock=before-num(item.qty);

    db.stockMovements.push({
      id:uid("STM"),
      date:localDate(),
      time:localTime(),
      type:"Purchase Void",
      productId:p.id,
      productName:p.name,
      qty:-num(item.qty),
      before,
      after:p.stock,
      reference:purchase.invoice
    });
  }

  if(num(purchase.paid)>0){

    db.cashTransactions.push({
      id:uid("CASH"),
      date:localDate(),
      time:localTime(),
      type:"Purchase Void",
      category:"Reversal",
      description:`Void ${purchase.invoice}`,
      amount:num(purchase.paid),
      reference:purchase.invoice
    });
  }

  saveDB();
  renderPage("purchases");
  toast("Purchase voided and stock reversed");
}

function saveAdjustment(){

  const productId=document.getElementById("adjProduct").value;
  const newQty=num(document.getElementById("adjQty").value);
  const reason=document.getElementById("adjReason").value.trim();

  const p=db.products.find(x=>x.id===productId);

  if(!p) return;

  const before=num(p.stock);
  const difference=newQty-before;

  p.stock=newQty;

  db.stockMovements.push({
    id:uid("STM"),
    date:localDate(),
    time:localTime(),
    type:"Adjustment",
    productId:p.id,
    productName:p.name,
    qty:difference,
    before,
    after:newQty,
    reference:reason||"Manual Adjustment"
  });

  saveDB();
  closeModal();
  renderPage("inventory");
  toast("Stock adjusted");
}

function openCustomerPayment(customerId){

  const c=db.customers.find(x=>x.id===customerId);

  if(!c){
    toast("Customer not found");
    return;
  }

  const balance=customerBalance(customerId);

  if(balance<=0){
    toast("This customer has no outstanding balance");
    return;
  }

  openModal(
    "Customer Payment",
    `
      <div class="alert alert-info">
        Customer: <strong>${esc(c.name)}</strong><br>
        Outstanding: <strong>${money(balance)}</strong>
      </div>

      <div class="form-grid">

        <div class="field">
          <label>Payment Amount *</label>
          <input id="custPayAmount" type="number" min="0" max="${balance}" value="${balance}">
        </div>

        <div class="field">
          <label>Payment Method</label>
          <select id="custPayMethod">
            <option>Cash</option>
            <option>KPay</option>
            <option>WavePay</option>
            <option>Bank</option>
          </select>
        </div>

      </div>
    `,
    `
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-success" onclick="saveCustomerPayment('${customerId}')">Record Payment</button>
    `
  );
}

function saveCustomerPayment(customerId){

  const amount=num(document.getElementById("custPayAmount").value);
  const method=document.getElementById("custPayMethod").value;

  if(amount<=0){
    toast("Enter payment amount");
    return;
  }

  let remaining=amount;

  const openSales=db.sales
    .filter(s=>s.customerId===customerId && s.status!=="Voided" && num(s.balance)>0)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  const totalOutstanding=openSales.reduce((a,s)=>a+num(s.balance),0);

  if(amount>totalOutstanding){
    toast("Payment exceeds outstanding balance");
    return;
  }

  for(const sale of openSales){

    if(remaining<=0) break;

    const allocation=Math.min(remaining,num(sale.balance));

    sale.paid=num(sale.paid)+allocation;
    sale.balance=num(sale.total)-sale.paid;
    sale.status=sale.balance<=0?"Paid":"Credit";

    db.customerPayments.push({
      id:uid("CP"),
      date:localDate(),
      time:localTime(),
      customerId,
      customerName:sale.customerName,
      amount:allocation,
      method,
      invoice:sale.invoice
    });

    remaining-=allocation;
  }

  db.cashTransactions.push({
    id:uid("CASH"),
    date:localDate(),
    time:localTime(),
    type:"Customer Payment",
    category:"Receivable",
    description:`Customer collection - ${db.customers.find(c=>c.id===customerId)?.name||""}`,
    amount,
    reference:"Customer Payment"
  });

  saveDB();
  closeModal();
  renderPage(currentPage);
  toast("Customer payment recorded");
}

function generateReport(){

  const from=document.getElementById("reportFrom").value;
  const to=document.getElementById("reportTo").value;

  if(from>to){
    toast("From date cannot be after To date");
    return;
  }

  const sales=totalSales(from,to);
  const cogs=totalCOGS(from,to);
  const gross=sales-cogs;
  const expenses=totalExpenses(from,to);
  const net=gross-expenses;

  const saleCount=db.sales.filter(s=>
    s.status!=="Voided" &&
    dateFilter(s.date,from,to)
  ).length;

  const purchaseTotal=db.purchases
    .filter(p=>p.status!=="Voided" && dateFilter(p.date,from,to))
    .reduce((a,p)=>a+num(p.total),0);

  const output=document.getElementById("reportOutput");

  output.innerHTML=`

    <div class="stat-grid">

      <div class="stat-card">
        <div class="stat-label">SALES</div>
        <div class="stat-value">${money(sales)}</div>
        <div class="stat-note">${saleCount} invoices</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">COGS</div>
        <div class="stat-value">${money(cogs)}</div>
        <div class="stat-note">Cost of goods sold</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">GROSS PROFIT</div>
        <div class="stat-value">${money(gross)}</div>
        <div class="stat-note">${sales>0?((gross/sales)*100).toFixed(1):0}% margin</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">EXPENSES</div>
        <div class="stat-value">${money(expenses)}</div>
        <div class="stat-note">Operating expenses</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">NET PROFIT</div>
        <div class="stat-value">${money(net)}</div>
        <div class="stat-note">Gross profit less expenses</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">PURCHASES</div>
        <div class="stat-value">${money(purchaseTotal)}</div>
        <div class="stat-note">Purchase invoices</div>
      </div>

    </div>

    <div class="grid-2">

      <div class="card">

        <div class="card-head">
          <h3>Sales vs COGS vs Profit</h3>
        </div>

        <div class="card-body">

          <div class="kpi-list">

            <div>
              <div class="kpi-row">
                <span>Sales</span>
                <strong>${money(sales)}</strong>
              </div>
              <div class="progress">
                <span style="width:${sales?100:0}%"></span>
              </div>
            </div>

            <div>
              <div class="kpi-row">
                <span>COGS</span>
                <strong>${money(cogs)}</strong>
              </div>
              <div class="progress">
                <span style="width:${sales?Math.min(100,(cogs/sales)*100):0}%"></span>
              </div>
            </div>

            <div>
              <div class="kpi-row">
                <span>Gross Profit</span>
                <strong>${money(gross)}</strong>
              </div>
              <div class="progress">
                <span style="width:${sales?Math.max(0,Math.min(100,(gross/sales)*100)):0}%"></span>
              </div>
            </div>

          </div>

        </div>

      </div>

      <div class="card">

        <div class="card-head">
          <h3>Outstanding</h3>
        </div>

        <div class="card-body">

          <div class="total-line">
            <span>Receivables</span>
            <strong class="text-danger">${money(receivables())}</strong>
          </div>

          <div class="total-line">
            <span>Payables</span>
            <strong class="text-danger">${money(payables())}</strong>
          </div>

          <div class="total-line final">
            <span>Net Working Position</span>
            <strong>${money(receivables()-payables())}</strong>
          </div>

        </div>

      </div>

    </div>

    <div class="card" style="margin-top:18px">

      <div class="card-head">
        <h3>Sales by Day</h3>
      </div>

      <div class="card-body">
        ${dailySalesChart(from,to)}
      </div>

    </div>
  `;
}

function dailySalesChart(from,to){

  const start=new Date(from+"T00:00:00");
  const end=new Date(to+"T00:00:00");

  const days=[];

  let current=new Date(start);

  while(current<=end && days.length<31){

    const d=localDate(current);

    const value=totalSales(d,d);

    days.push({
      date:d,
      label:d.slice(5),
      value
    });

    current.setDate(current.getDate()+1);
  }

  const max=Math.max(...days.map(x=>x.value),1);

  return `
    <div class="chart">

      ${days.map(d=>`
        <div class="bar-wrap">

          <div class="bar-value">${d.value?money(d.value).split(" ")[0]:""}</div>

          <div
            class="bar"
            style="height:${Math.max(3,(d.value/max)*170)}px"
            title="${esc(d.date)} — ${money(d.value)}"
          ></div>

          <div class="bar-label">${esc(d.label)}</div>

        </div>
      `).join("")}

    </div>
  `;
}

/* =========================================================

========================================================= */

function backupData(){

  const payload={
    app:"SME Business OS",
    version:db.version,
    exportedAt:nowISO(),
    data:db
  };

  const blob=new Blob(
    [JSON.stringify(payload,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=`SME-Business-OS-Backup-${localDate()}.json`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  toast("Backup downloaded");
}

document.getElementById("restoreFile").addEventListener("change",function(e){

  const file=e.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const parsed=JSON.parse(reader.result);

      const restored=parsed.data||parsed;

      if(!restored || !Array.isArray(restored.products)){
        throw new Error("Invalid backup");
      }

      db={
        ...defaultDB(),
        ...restored,
        settings:{
          ...defaultDB().settings,
          ...(restored.settings||{})
        }
      };

      saveDB();
      renderPage(currentPage);

      toast("Backup restored successfully");

    }catch(err){

      console.error(err);
      toast("Invalid backup file");

    }

    e.target.value="";
  };

  reader.readAsText(file);
});

function resetDatabase(){

  const confirmation=prompt(
    "Type RESET to permanently clear all local business data"
  );

  if(confirmation!=="RESET"){
    toast("Reset cancelled");
    return;
  }

  db=defaultDB();
  saleCart=[];
  purchaseCart=[];

  saveDB();
  renderPage("dashboard");

  toast("All local data has been reset");
}

/* =========================================================
   CSV EXPORT
========================================================= */

function exportCSV(type){

  let rows=[];
  let filename="export.csv";

  if(type==="sales"){

    filename="sales.csv";

    rows=[
      ["Invoice","Date","Customer","Total","Paid","Balance","Payment","Status"]
    ];

    db.sales.forEach(s=>{
      rows.push([
        s.invoice,
        s.date,
        s.customerName,
        s.total,
        s.paid,
        s.balance,
        s.payment,
        s.status
      ]);
    });

  }else if(type==="purchases"){

    filename="purchases.csv";

    rows=[
      ["Invoice","Date","Supplier","Total","Paid","Balance","Payment","Status"]
    ];

    db.purchases.forEach(p=>{
      rows.push([
        p.invoice,
        p.date,
        p.supplierName,
        p.total,
        p.paid,
        p.balance,
        p.payment,
        p.status
      ]);
    });
  }

  const csv=rows.map(row=>
    row.map(v=>{
      const s=String(v??"").replace(/"/g,'""');
      return `"${s}"`;
    }).join(",")
  ).join("\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  toast("CSV exported");
}
